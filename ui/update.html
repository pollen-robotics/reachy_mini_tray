<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reachy Mini Tray - Update</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1c1c1e;
        --fg-dim: #6c6c70;
        --fg-faint: #8e8e93;
        --accent: #ff9500;
        --accent-soft: rgba(255, 149, 0, 0.1);
        --error: #ef4444;
        --track: rgba(120, 120, 128, 0.18);
        --chip-bg: rgba(255, 149, 0, 0.1);
        --chip-fg: #ff9500;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --fg: #f2f2f7;
          --fg-dim: #a1a1a6;
          --fg-faint: #6e6e73;
          --accent: #ffb340;
          --accent-soft: rgba(255, 179, 64, 0.14);
          --track: rgba(120, 120, 128, 0.32);
          --chip-bg: rgba(255, 179, 64, 0.16);
          --chip-fg: #ffb340;
          --error: #f87171;
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Centered, single-column card - mirrors the desktop app's update view. */
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100%;
        padding: 30px 34px 26px;
        gap: 4px;
      }

      .illustration {
        width: 128px;
        height: 128px;
        object-fit: contain;
        margin-bottom: 14px;
        -webkit-user-drag: none;
        user-drag: none;
        pointer-events: none;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .subtitle {
        margin: 0 0 14px;
        color: var(--fg-dim);
        font-size: 12.5px;
        line-height: 1.45;
        max-width: 300px;
      }

      .version-line {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        font-variant-numeric: tabular-nums;
      }
      .version-pill {
        font-size: 12px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--track);
        color: var(--fg-dim);
      }
      .version-pill.new {
        background: var(--chip-bg);
        color: var(--chip-fg);
      }
      .arrow {
        color: var(--fg-faint);
        font-size: 14px;
      }

      .notes {
        max-width: 320px;
        max-height: 60px;
        overflow-y: auto;
        color: var(--fg-dim);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        scrollbar-width: thin;
        margin-bottom: 14px;
      }
      .notes:empty {
        display: none;
      }

      .progress-track {
        position: relative;
        width: 100%;
        max-width: 300px;
        height: 5px;
        background: var(--track);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 8px;
        display: none;
      }
      .progress-track.visible {
        display: block;
      }
      .progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: var(--p, 0%);
        background: var(--accent);
        border-radius: 999px;
        transition: width 0.2s ease-out;
      }
      .progress-track.indeterminate .progress-bar {
        width: 35% !important;
        animation: slide 1.6s ease-in-out infinite;
        transition: none;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(220%);
        }
        100% {
          transform: translateX(-100%);
        }
      }

      .status-line {
        font-size: 11.5px;
        color: var(--fg-faint);
        min-height: 14px;
        margin-bottom: 12px;
      }
      .status-line.error {
        color: var(--error);
      }

      /* Primary, outlined - accent border + text, subtle fill on hover. */
      .btn-primary {
        appearance: none;
        min-width: 200px;
        border-radius: 9px;
        padding: 10px 22px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        background: transparent;
        color: var(--accent);
        border: 1.5px solid var(--accent);
        transition: background-color 0.15s ease, opacity 0.15s ease;
      }
      .btn-primary:hover {
        background: var(--accent-soft);
      }
      .btn-primary:active {
        background: var(--accent-soft);
        opacity: 0.85;
      }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: default;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="illustration" src="./reachy-update-box.png" alt="Reachy Mini in a box" />

      <h1>Update available</h1>
      <p class="subtitle">A new version of Reachy Mini Tray is ready to install.</p>

      <div class="version-line">
        <span class="version-pill" id="current-version">&hellip;</span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
        <span class="version-pill new" id="new-version">&hellip;</span>
      </div>

      <div class="notes" id="notes"></div>

      <div class="progress-track" id="track">
        <div class="progress-bar" id="bar"></div>
      </div>

      <div class="status-line" id="status"></div>

      <button class="btn-primary" id="install-btn">Install and restart</button>
    </main>

    <script>
      // The update overlay is a thin presentational layer over the Rust
      // `app_update` module. It:
      //   - pulls the pending version via `get_app_update_info` on load
      //     (and listens to `app-update:available` in case it opened first),
      //   - triggers `install_app_update` on button click,
      //   - reflects `app-update:progress` on the bar and `app-update:error`
      //     in the status line.
      // On success the Rust side relaunches the app, so this window just
      // vanishes with the process - no explicit "done" handling needed.
      const tauri = window.__TAURI__;

      const currentEl = document.getElementById("current-version");
      const newEl = document.getElementById("new-version");
      const notesEl = document.getElementById("notes");
      const track = document.getElementById("track");
      const bar = document.getElementById("bar");
      const statusEl = document.getElementById("status");
      const installBtn = document.getElementById("install-btn");

      let installing = false;

      function applyInfo(info) {
        if (!info) return;
        if (info.current) currentEl.textContent = "v" + info.current;
        if (info.version) newEl.textContent = "v" + info.version;
        if (info.notes && info.notes.trim().length > 0) {
          notesEl.textContent = info.notes.trim();
        }
      }

      function setStatus(text, isError) {
        statusEl.textContent = text || "";
        statusEl.classList.toggle("error", !!isError);
      }

      async function loadInfo() {
        if (!tauri?.core?.invoke) return;
        try {
          const info = await tauri.core.invoke("get_app_update_info");
          applyInfo(info);
        } catch (e) {
          console.warn("get_app_update_info failed", e);
        }
      }

      function onProgress(payload) {
        track.classList.add("visible");
        if (payload && typeof payload.percent === "number") {
          track.classList.remove("indeterminate");
          bar.style.setProperty("--p", payload.percent + "%");
          setStatus("Downloading\u2026 " + payload.percent + "%");
        } else {
          // No content-length: show an indeterminate sweep.
          track.classList.add("indeterminate");
          setStatus("Downloading\u2026");
        }
      }

      async function install() {
        if (installing || !tauri?.core?.invoke) return;
        installing = true;
        installBtn.disabled = true;
        installBtn.textContent = "Installing\u2026";
        track.classList.add("visible", "indeterminate");
        setStatus("Preparing download\u2026");
        try {
          await tauri.core.invoke("install_app_update");
          // On success the app relaunches; if we're still here, keep the
          // "installing" state - the restart is imminent.
          setStatus("Restarting\u2026");
        } catch (e) {
          installing = false;
          installBtn.disabled = false;
          installBtn.textContent = "Retry install";
          track.classList.remove("visible", "indeterminate");
          setStatus(String(e && e.message ? e.message : e), true);
        }
      }

      installBtn.addEventListener("click", install);

      if (tauri?.event?.listen) {
        tauri.event
          .listen("app-update:available", (evt) => applyInfo(evt.payload))
          .catch((err) => console.warn("listen(app-update:available) failed", err));
        tauri.event
          .listen("app-update:progress", (evt) => onProgress(evt.payload))
          .catch((err) => console.warn("listen(app-update:progress) failed", err));
        tauri.event
          .listen("app-update:error", (evt) => {
            installing = false;
            installBtn.disabled = false;
            installBtn.textContent = "Retry install";
            track.classList.remove("visible", "indeterminate");
            setStatus(String(evt.payload), true);
          })
          .catch((err) => console.warn("listen(app-update:error) failed", err));
      }

      loadInfo();
    </script>
  </body>
</html>
